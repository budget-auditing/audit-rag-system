[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-rag"
version = "0.1.0"
description = "TRACE: Transport-based Risk Alignment for Chain-of-Evidence Generation"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "faiss-cpu>=1.7.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
embed-server = ["FlagEmbedding>=1.3.2"]
data-build = [
    "pymupdf>=1.23",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "markitdown>=0.0.1",
    "tiktoken>=0.5",
]
service = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
trace-retrieve = "trace_rag.cli.run_retrieval:main"
trace-evidence = "trace_rag.cli.run_evidence:main"
trace-generate = "trace_rag.cli.run_generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
